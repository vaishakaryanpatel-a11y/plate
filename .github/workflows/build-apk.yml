name: Build PlateWise APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Scaffold Flutter project if missing
        run: |
          set -e
          if [ -f pubspec.yaml ] && [ -d lib ]; then
            flutter create . \
              --org com.platewise \
              --project-name platewise \
              --platforms=android \
              --overwrite
          else
            flutter create . \
              --org com.platewise \
              --project-name platewise \
              --platforms=android
            mkdir -p lib
            cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() => runApp(const PlateWiseApp());

          class PlateWiseApp extends StatelessWidget {
            const PlateWiseApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PlateWise',
                theme: ThemeData(
                  colorSchemeSeed: const Color(0xFF2E7D32),
                  useMaterial3: true,
                ),
                home: const Scaffold(
                  body: Center(
                    child: Text(
                      'PlateWise\nscaffold build — pipeline OK',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 22),
                    ),
                  ),
                ),
              );
            }
          }
          DART
          fi

      - name: Create placeholder assets
        run: |
          set -e
          mkdir -p assets/sounds assets/models android/app/src/main/res/raw
          [ -f assets/sounds/water_drop.mp3 ] || printf '\x00' > assets/sounds/water_drop.mp3
          for model in squat pushup plank lunge glute_bridge hip_thrust jumping_jacks \
                       mountain_climber burpee high_knees wall_sit side_plank superman \
                       bird_dog donkey_kick tricep_dip barbell_squat leg_press rdl \
                       leg_curl calf_raise bench_press incline_press cable_fly \
                       lat_pulldown seated_row barbell_row deadlift shoulder_press \
                       lateral_raise face_pull bicep_curl hammer_curl pushdown \
                       hanging_leg_raise cable_crunch; do
            [ -f "assets/models/$model.glb" ] || printf '\x00' > "assets/models/$model.glb"
          done
          cp assets/sounds/water_drop.mp3 android/app/src/main/res/raw/water_drop.mp3

      - name: Patch Android build config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle")
          text = app.read_text()
          text = re.sub(r"minSdk(?:Version)?\s+(?:flutter\.)?minSdkVersion", "minSdkVersion 23", text)
          text = re.sub(r"compileSdk(?:Version)?\s+(?:flutter\.)?compileSdkVersion", "compileSdkVersion 34", text)
          text = re.sub(r"targetSdk(?:Version)?\s+(?:flutter\.)?targetSdkVersion", "targetSdkVersion 34", text)
          if "coreLibraryDesugaringEnabled true" not in text:
              block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }"""
              match = re.search(r"compileOptions\s*\{.*?\}", text, re.DOTALL)
              if match:
                  text = text[:match.start()] + block + text[match.end():]
              else:
                  text += "\n\nandroid {\n    " + block.replace("\n", "\n    ") + "\n}\n"
          if "jvmTarget = '17'" not in text:
              kotlin_options = "\n\n    kotlinOptions {\n        jvmTarget = '17'\n    }"
              match = re.search(r"compileOptions\s*\{.*?\}", text, re.DOTALL)
              if match:
                  text = text[:match.end()] + kotlin_options + text[match.end():]
          if "KotlinCompile" not in text:
              text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          if "multiDexEnabled true" not in text:
              text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
          if "desugar_jdk_libs" not in text:
              dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n" + dependency, 1)
              else:
                  text += "\n\ndependencies {\n" + dependency + "}\n"
          app.write_text(text)

          root = Path("android/build.gradle")
          if root.exists():
              text = root.read_text()
              text = re.sub(
                  r"ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]",
                  "ext.kotlin_version = '1.9.24'",
                  text,
              )
              root.write_text(text)
          PY

      - name: Patch AndroidManifest permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "android.permission.ACTIVITY_RECOGNITION",
              "android.permission.INTERNET",
          ]
          additions = "".join(
              f'    <uses-permission android:name="{permission}"/>\n'
              for permission in permissions
              if permission not in text
          )
          if additions:
              text = text.replace("<application", additions + "\n    <application", 1)
              manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage artifact
        run: |
          set -e
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/PlateWise-universal.apk
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlateWise-APK
          path: out/*.apk
          retention-days: 30
