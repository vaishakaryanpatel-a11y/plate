name: Build PlateWise APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare placeholder APK artifact
        run: |
          mkdir -p build
          printf '%s\n' 'PlateWise placeholder APK payload' > build/PlateWise-debug.apk
          ls -l build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlateWise-APK
          path: build/PlateWise-debug.apk
          if-no-files-found: error
